<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客家精神雲端音樂播放器 (純淨大字版)</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #121212; 
      color: #fff; 
      margin: 0;
      padding: 12px; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
      min-height: 100vh;
    }
    
    .player-card { 
      background: #1e1e1e; 
      padding: 20px 16px; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 480px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
      text-align: center; 
    }
    
    .player-toolbar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px; 
      gap: 8px;
    }
    
    .loop-mode-btn, .radio-switch-btn { 
      background: #2a2a2a; 
      color: #fff; 
      border: 1px solid #555; 
      border-radius: 8px; 
      padding: 8px 12px; 
      font-size: 14px; 
      cursor: pointer; 
    }
    
    .radio-switch-btn.active-radio {
      background: #d93025;
      border-color: #d93025;
      font-weight: bold;
    }
    
    h3#track-title { 
      margin: 4px 0 16px 0; 
      font-size: 24px; /* 稍微放大標題 */
      text-align: left; 
      word-break: break-all;
    }
    
    audio { width: 100%; margin-top: 6px; }

    /* --- 歌詞區塊優化 --- */
    .lyrics-container { 
      width: 100%; 
      height: 350px; /* 因為移除了封面，把歌詞區塊高度大幅拉長 */
      overflow-y: auto; 
      margin-top: 20px; 
      scroll-behavior: smooth; 
      scrollbar-width: none; 
      background: #181818; /* 給歌詞區塊一個微暗的底色幫助閱讀 */
      border-radius: 12px;
      padding: 10px 0;
    }
    .lyrics-container::-webkit-scrollbar { display: none; }
    
    .lyric-line { 
      color: #cccccc; /* 改為較亮的淺灰色，提升對比度 */
      font-size: 20px; /* 大幅放大未播放歌詞字體 */
      padding: 10px 12px; 
      line-height: 1.4;
      transition: color 0.3s, font-size 0.3s; 
    }
    .lyric-line.active { 
      color: #1ed760; /* 更鮮豔的亮綠色 */
      font-size: 28px; /* 大幅放大正在播放的歌詞字體 */
      font-weight: bold; 
    }
    /* -------------------- */

    .playlist { 
      margin-top: 20px; 
      text-align: left; 
      max-height: 220px; 
      overflow-y: auto; 
    }
    .track-btn { 
      width: 100%; 
      padding: 14px 16px; 
      margin: 6px 0; 
      background: #2a2a2a; 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      text-align: left; 
      font-size: 16px; 
    }
    .track-btn.active { 
      background: #1db954; 
      color: #000; 
      font-weight: bold; 
    }
    .loading { color: #aaa; font-size: 15px; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="player-card">
    
    <!-- 頂部工具列 -->
    <div class="player-toolbar">
      <span id="track-artist" style="color: #aaa; font-size: 15px;">MZG 馬子狗</span>
      <button id="radio-btn" class="radio-switch-btn">📻 即時廣播直播</button>
      <button id="loop-btn" class="loop-mode-btn">🔁 列表循環</button>
    </div>

    <!-- 標題與播放器 -->
    <h3 id="track-title">載入中...</h3>
    <audio id="audio-player" controls preload="metadata"></audio>

    <!-- 歌詞顯示區 -->
    <div class="lyrics-container" id="lyrics-container">
      <div class="lyric-line">自動搜尋同名 .lrc 歌詞中...</div>
    </div>

    <!-- 播放清單 -->
    <div id="loading-msg" class="loading">正在讀取 [MUSIC] 資料夾...</div>
    <div class="playlist" id="playlist"></div>
  </div>

  <script>
    // ================= 您的專屬設定 =================
    const API_KEY = 'AIzaSyClVDG_eXTcR5U1-4j9tN_9tJKfoegBf1c'; 
    const FOLDER_ID = '1n0n4ZJUGrtDtEcc79QakcMUYG52g60UX';     
    const STABLE_RADIO_URL = 'https://stream.hinet.net/live/radio/hichannel/hinet007.mp3'; 
    // =================================================

    let playlistData = [];
    let currentIndex = 0;
    let parsedLyrics = [];
    let loopMode = 'list'; 
    let isRadioMode = false;

    const audio = document.getElementById('audio-player');
    const titleEl = document.getElementById('track-title');
    const artistEl = document.getElementById('track-artist');
    const lyricsContainer = document.getElementById('lyrics-container');
    const playlistContainer = document.getElementById('playlist');
    const loadingMsg = document.getElementById('loading-msg');
    const loopBtn = document.getElementById('loop-btn');
    const radioBtn = document.getElementById('radio-btn');

    // 切換循環模式
    loopBtn.addEventListener('click', () => {
      if (isRadioMode) return;
      if (loopMode === 'list') {
        loopMode = 'single';
        loopBtn.textContent = '🔂 單曲循環';
      } else if (loopMode === 'single') {
        loopMode = 'shuffle';
        loopBtn.textContent = '🔀 隨機播放';
      } else {
        loopMode = 'list';
        loopBtn.textContent = '🔁 列表循環';
      }
    });

    // 切換廣播模式
    radioBtn.addEventListener('click', () => {
      if (!isRadioMode) {
        isRadioMode = true;
        radioBtn.classList.add('active-radio');
        radioBtn.textContent = '🎵 返回雲端音樂';
        loopBtn.style.display = 'none';
        
        titleEl.textContent = '警察廣播電台 (全國治安交通網)';
        artistEl.textContent = '線上即時廣播直播';
        
        audio.src = STABLE_RADIO_URL;
        audio.play().catch(e => {
          alert('廣播播放失敗，請確認網路連線');
          console.error(e);
        });

        lyricsContainer.innerHTML = '<div class="lyric-line active">📻 正在線上收聽即時廣播直播...<br><br><a href="https://www.bestradio.com.tw/" target="_blank" style="color: #1db954; display:inline-block; font-size: 18px;">👉 點此另開視窗收聽港都電台官網</a></div>';
        playlistContainer.style.display = 'none';
        loadingMsg.style.display = 'none';
      } else {
        isRadioMode = false;
        radioBtn.classList.remove('active-radio');
        radioBtn.textContent = '📻 即時廣播直播';
        loopBtn.style.display = 'block';
        playlistContainer.style.display = 'block';
        
        if (playlistData.length > 0) {
          loadTrack(currentIndex);
        }
      }
    });

    async function fetchDriveFiles() {
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data.files) {
          loadingMsg.textContent = '無法讀取資料夾，請檢查 API Key 或權限。';
          return;
        }

        const mp3Files = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
        const lrcFiles = data.files.filter(f => f.name.toLowerCase().endsWith('.lrc'));

        playlistData = mp3Files.map(mp3 => {
          const baseName = mp3.name.substring(0, mp3.name.lastIndexOf('.'));
          const matchedLrc = lrcFiles.find(lrc => lrc.name.substring(0, lrc.name.lastIndexOf('.')) === baseName);
          return {
            title: baseName,
            id: mp3.id,
            lrcId: matchedLrc ? matchedLrc.id : null
          };
        });

        loadingMsg.style.display = 'none';
        if (playlistData.length > 0) {
          renderPlaylist();
          loadTrack(0);
        } else {
          loadingMsg.textContent = '[MUSIC] 資料夾內沒有 MP3 檔案。';
          loadingMsg.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        loadingMsg.textContent = '讀取失敗，請確認 API 狀態。';
      }
    }

    async function fetchLRC(lrcId) {
      if (!lrcId) return [];
      const url = `https://www.googleapis.com/drive/v3/files/${lrcId}?alt=media&key=${API_KEY}`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        return parseLRC(text);
      } catch (e) {
        return [];
      }
    }

    function parseLRC(lrcString) {
      if (!lrcString) return [];
      const lines = lrcString.split('\n');
      const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
      const lyrics = [];
      for (const line of lines) {
        const match = line.match(regex);
        if (match) {
          const min = parseInt(match[1], 10);
          const sec = parseInt(match[2], 10);
          const ms = parseInt(match[3], 10);
          const time = min * 60 + sec + ms / (match[3].length === 2 ? 100 : 1000);
          const text = match[4].trim();
          if (text) lyrics.push({ time, text });
        }
      }
      return lyrics;
    }

    async function loadTrack(index) {
      if (isRadioMode) return;
      const track = playlistData[index];
      currentIndex = index;
      titleEl.textContent = track.title;
      artistEl.textContent = 'MZG 馬子狗';
      
      audio.src = `https://www.googleapis.com/drive/v3/files/${track.id}?alt=media&key=${API_KEY}`;

      lyricsContainer.innerHTML = '<div class="lyric-line">載入歌詞中...</div>';
      parsedLyrics = await fetchLRC(track.lrcId);
      
      lyricsContainer.innerHTML = '';
      if (parsedLyrics.length > 0) {
        parsedLyrics.forEach((lyric, idx) => {
          const div = document.createElement('div');
          div.className = 'lyric-line';
          div.id = `lyric-${idx}`;
          div.textContent = lyric.text;
          lyricsContainer.appendChild(div);
        });
      } else {
        lyricsContainer.innerHTML = '<div class="lyric-line">無提供歌詞 (.lrc)</div>';
      }

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: track.title, album: 'MZG 客家精神音樂播放器' });
      }

      updatePlaylistUI();
    }

    audio.addEventListener('timeupdate', () => {
      if (isRadioMode || parsedLyrics.length === 0) return;
      const currentTime = audio.currentTime;
      let activeIndex = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) activeIndex = i;
        else break;
      }
      if (activeIndex !== -1) {
        const allLines = lyricsContainer.querySelectorAll('.lyric-line');
        allLines.forEach(line => line.classList.remove('active'));
        const activeLine = document.getElementById(`lyric-${activeIndex}`);
        if (activeLine && !activeLine.classList.contains('active')) {
          activeLine.classList.add('active');
          activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });

    audio.addEventListener('ended', () => {
      if (isRadioMode) return;
      if (loopMode === 'single') {
        audio.currentTime = 0;
        audio.play();
      } else if (loopMode === 'shuffle') {
        const randomIndex = Math.floor(Math.random() * playlistData.length);
        loadTrack(randomIndex);
        audio.play();
      } else {
        const next = (currentIndex + 1) % playlistData.length;
        loadTrack(next);
        audio.play();
      }
    });

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlistData.forEach((track, index) => {
        const btn = document.createElement('button');
        btn.className = 'track-btn';
        btn.textContent = `${index + 1}. ${track.title}`;
        btn.onclick = () => { 
          if (isRadioMode) {
            isRadioMode = false;
            radioBtn.classList.remove('active-radio');
            radioBtn.textContent = '📻 即時廣播直播';
            loopBtn.style.display = 'block';
            playlistContainer.style.display = 'block';
          }
          loadTrack(index); 
          audio.play(); 
        };
        playlistContainer.appendChild(btn);
      });
    }

    function updatePlaylistUI() {
      const buttons = playlistContainer.querySelectorAll('.track-btn');
      buttons.forEach((btn, idx) => btn.classList.toggle('active', idx === currentIndex));
    }

    fetchDriveFiles();
  </script>
</body>
</html>
