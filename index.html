<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客家精神雲端音樂播放器 (多歌單切換版)</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #121212; 
      color: #fff; 
      margin: 0;
      padding: 12px; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
      min-height: 100vh;
    }
    
    .player-card { 
      background: #1e1e1e; 
      padding: 20px 16px; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 480px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
      text-align: center; 
    }
    
    /* --- 歌單切換下拉選單 --- */
    .folder-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #444;
    }
    .folder-selector label {
      font-size: 14px;
      color: #ccc;
      white-space: nowrap;
    }
    .folder-selector select {
      flex: 1;
      background: #1e1e1e;
      color: #1db954;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 6px;
      font-size: 14px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
    
    h3#track-title { 
      margin: 4px 0 6px 0; 
      font-size: 24px; 
      text-align: left; 
      word-break: break-all;
    }

    #track-artist {
      display: block;
      text-align: left;
      color: #aaa; 
      font-size: 15px;
      margin-bottom: 12px;
    }
    
    audio { width: 100%; margin-top: 6px; }

    /* --- 播放控制列 (上一首/循環/下一首) --- */
    .player-toolbar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-top: 12px;
      margin-bottom: 16px; 
      gap: 8px;
    }
    
    .nav-btn, .loop-mode-btn, .toggle-btn { 
      background: #2a2a2a; 
      color: #fff; 
      border: 1px solid #555; 
      border-radius: 8px; 
      padding: 10px 12px; 
      font-size: 14px; 
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-btn:hover, .loop-mode-btn:hover, .toggle-btn:hover {
      background: #3a3a3a;
    }

    .loop-mode-btn {
      flex: 1; 
      font-weight: bold;
    }

    .toggle-btn {
      width: 100%;
      margin-bottom: 8px;
    }

    /* --- 分類頁籤區塊 --- */
    .playlist-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #1db954;
      color: #000;
      font-weight: bold;
      border-color: #1db954;
    }

    /* --- 音樂選單區塊 --- */
    .playlist { 
      margin-bottom: 16px; 
      text-align: left; 
      height: 240px; 
      overflow-y: auto; 
      background: #181818; 
      border-radius: 12px;
      padding: 10px;
    }
    .track-btn { 
      width: 100%; 
      padding: 14px 16px; 
      margin: 4px 0; 
      background: #2a2a2a; 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      text-align: left; 
      font-size: 16px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-btn.active { 
      background: #1db954; 
      color: #000; 
      font-weight: bold; 
    }
    
    .badge-long {
      font-size: 12px;
      background: #ff9800; 
      color: #000;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      white-space: nowrap;
      margin-left: 10px;
    }

    /* --- 歌詞區塊 --- */
    .lyrics-container { 
      width: 100%; 
      height: 200px; 
      overflow-y: auto; 
      scroll-behavior: smooth; 
      scrollbar-width: none; 
      background: #181818; 
      border-radius: 12px;
      padding: 10px 0;
      transition: height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
    }
    .lyrics-container::-webkit-scrollbar { display: none; }
    
    .hidden-lyrics {
      height: 0;
      opacity: 0;
      padding: 0;
      pointer-events: none;
      margin: 0;
    }

    .lyric-line { 
      color: #cccccc; 
      font-size: 20px; 
      padding: 10px 12px; 
      line-height: 1.4;
      transition: color 0.3s, font-size 0.3s; 
    }
    .lyric-line.active { 
      color: #1ed760; 
      font-size: 28px; 
      font-weight: bold; 
    }

    .loading { color: #aaa; font-size: 15px; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="player-card">
    
    <!-- 歌單切換選單 -->
    <div class="folder-selector">
      <label for="folder-select">📁 選擇歌單</label>
      <select id="folder-select">
        <option value="music1">[MUSIC] 預設主資料夾</option>
        <option value="music2">[MUSIC2] 其他音樂與專輯</option>
        <!-- 如果未來還有 MUSIC3，可以直接在這裡複製新增一行 -->
      </select>
    </div>

    <!-- 標題與播放器 -->
    <h3 id="track-title">載入中...</h3>
    <span id="track-artist">MZG 馬子狗</span>
    <audio id="audio-player" controls preload="metadata"></audio>

    <!-- 播放控制列 -->
    <div class="player-toolbar">
      <button id="prev-btn" class="nav-btn">⏮ 上一首</button>
      <button id="loop-btn" class="loop-mode-btn">🔁 列表循環</button>
      <button id="next-btn" class="nav-btn">下一首 ⏭</button>
    </div>

    <!-- 分類頁籤 -->
    <div class="playlist-tabs" id="playlist-tabs" style="display: none;">
      <button class="tab-btn active" data-filter="all">全部</button>
      <button class="tab-btn" data-filter="short">單曲 (10分內)</button>
      <button class="tab-btn" data-filter="long">長篇 (10分+)</button>
    </div>

    <!-- 播放清單 -->
    <div id="loading-msg" class="loading">正在讀取資料夾，請稍候...</div>
    <div class="playlist" id="playlist" style="display: none;"></div>

    <!-- 歌詞切換按鈕與顯示區 -->
    <button id="toggle-lyrics-btn" class="toggle-btn" style="display: none;">🔽 隱藏歌詞</button>
    <div class="lyrics-container" id="lyrics-container">
      <div class="lyric-line">自動搜尋同名 .lrc 歌詞中...</div>
    </div>

  </div>

  <script>
    // ================= 您的專屬設定 =================
    const API_KEY = 'AIzaSyClVDG_eXTcR5U1-4j9tN_9tJKfoegBf1c'; 
    
    // 【重要】請在這裡設定您所有的資料夾 ID
    const FOLDERS = {
      'music1': '1n0n4ZJUGrtDtEcc79QakcMUYG52g60UX', // 原本的 MUSIC 資料夾
      'music2': '12qXblcE82laVwc7d7VhUoEzusnWTNmZ6'     // 👈 請替換這裡！
    };
    // =================================================

    let playlistData = [];
    let currentIndex = 0;
    let parsedLyrics = [];
    let currentFilter = 'all'; 

    // === 本地記憶 Keys ===
    const SAVED_FOLDER_KEY = 'mzg_saved_folder';
    const SAVED_LOOP_KEY = 'mzg_saved_loop_mode';
    const SAVED_LYRICS_KEY = 'mzg_saved_lyrics_state';
    
    // 依據不同資料夾，產生專屬的記憶 Key，讓不同資料夾各自記憶進度！
    function getIndexKey() { return `mzg_saved_track_index_${currentFolderKey}`; }
    function getTimeKey() { return `mzg_saved_track_time_${currentFolderKey}`; }

    // 讀取全域記憶狀態
    let currentFolderKey = localStorage.getItem(SAVED_FOLDER_KEY) || 'music1';
    // 防呆：如果紀錄的資料夾不存在，退回 music1
    if (!FOLDERS[currentFolderKey]) currentFolderKey = 'music1'; 
    
    let loopMode = localStorage.getItem(SAVED_LOOP_KEY) || 'list'; 
    let isLyricsHidden = localStorage.getItem(SAVED_LYRICS_KEY) === 'true';

    const audio = document.getElementById('audio-player');
    const titleEl = document.getElementById('track-title');
    const lyricsContainer = document.getElementById('lyrics-container');
    const playlistContainer = document.getElementById('playlist');
    const tabsContainer = document.getElementById('playlist-tabs');
    const loadingMsg = document.getElementById('loading-msg');
    
    const loopBtn = document.getElementById('loop-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const toggleLyricsBtn = document.getElementById('toggle-lyrics-btn');
    const folderSelect = document.getElementById('folder-select');

    // 初始化下拉選單
    folderSelect.value = currentFolderKey;
    folderSelect.addEventListener('change', (e) => {
      currentFolderKey = e.target.value;
      localStorage.setItem(SAVED_FOLDER_KEY, currentFolderKey);
      
      // 切換資料夾時暫停播放，重置畫面並重新讀取
      audio.pause();
      audio.src = '';
      titleEl.textContent = '載入中...';
      lyricsContainer.innerHTML = '<div class="lyric-line">載入中...</div>';
      playlistContainer.style.display = 'none';
      tabsContainer.style.display = 'none';
      toggleLyricsBtn.style.display = 'none';
      loadingMsg.style.display = 'block';
      
      fetchDriveFiles();
    });

    // === 歌詞縮放記憶邏輯 ===
    function updateLyricsUI() {
      if (isLyricsHidden) {
        lyricsContainer.classList.add('hidden-lyrics');
        toggleLyricsBtn.textContent = '🖼️ 展開歌詞顯示區';
      } else {
        lyricsContainer.classList.remove('hidden-lyrics');
        toggleLyricsBtn.textContent = '🔽 縮小隱藏歌詞區';
      }
    }
    updateLyricsUI();

    toggleLyricsBtn.addEventListener('click', () => {
      isLyricsHidden = !isLyricsHidden;
      localStorage.setItem(SAVED_LYRICS_KEY, isLyricsHidden);
      updateLyricsUI();
    });

    // === 播放循環記憶邏輯 ===
    function updateLoopUI() {
      if (loopMode === 'single') loopBtn.textContent = '🔂 單曲循環';
      else if (loopMode === 'shuffle') loopBtn.textContent = '🔀 隨機播放';
      else loopBtn.textContent = '🔁 列表循環';
    }
    updateLoopUI();

    loopBtn.addEventListener('click', () => {
      if (loopMode === 'list') loopMode = 'single';
      else if (loopMode === 'single') loopMode = 'shuffle';
      else loopMode = 'list';
      
      localStorage.setItem(SAVED_LOOP_KEY, loopMode);
      updateLoopUI();
    });

    // === 分類頁籤邏輯 ===
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        tabBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        applyFilter();
      });
    });

    function applyFilter() {
      const buttons = playlistContainer.querySelectorAll('.track-btn');
      buttons.forEach(btn => {
        const isLong = btn.dataset.isLong === 'true';
        if (currentFilter === 'all') btn.style.display = 'flex';
        else if (currentFilter === 'short' && !isLong) btn.style.display = 'flex';
        else if (currentFilter === 'long' && isLong) btn.style.display = 'flex';
        else btn.style.display = 'none';
      });
    }

    // === 獲取目前有效歌單 (支援上下首與循環計算) ===
    function getValidIndices() {
      const validIndices = [];
      playlistData.forEach((track, index) => {
        if (currentFilter === 'all') validIndices.push(index);
        else if (currentFilter === 'short' && !track.isLong) validIndices.push(index);
        else if (currentFilter === 'long' && track.isLong) validIndices.push(index);
      });
      return validIndices;
    }

    function playNext() {
      const validIndices = getValidIndices();
      if (validIndices.length === 0) return;

      if (loopMode === 'shuffle') {
        const randomIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
        loadTrack(randomIdx, 0);
      } else {
        let currentPos = validIndices.indexOf(currentIndex);
        let nextPos = currentPos !== -1 ? (currentPos + 1) % validIndices.length : 0;
        loadTrack(validIndices[nextPos], 0);
      }
      audio.play();
    }

    function playPrev() {
      const validIndices = getValidIndices();
      if (validIndices.length === 0) return;

      if (loopMode === 'shuffle') {
        const randomIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
        loadTrack(randomIdx, 0);
      } else {
        let currentPos = validIndices.indexOf(currentIndex);
        let prevPos = currentPos !== -1 ? (currentPos - 1 + validIndices.length) % validIndices.length : 0;
        loadTrack(validIndices[prevPos], 0);
      }
      audio.play();
    }

    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);

    audio.addEventListener('ended', () => {
      if (loopMode === 'single') {
        audio.currentTime = 0;
        audio.play();
      } else {
        playNext();
      }
    });

    // === 核心檔案讀取 ===
    async function fetchDriveFiles() {
      const currentId = FOLDERS[currentFolderKey];
      const url = `https://www.googleapis.com/drive/v3/files?q='${currentId}'+in+parents+and+trashed=false&pageSize=1000&fields=files(id,name,mimeType,size)&key=${API_KEY}`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data.files) {
          loadingMsg.textContent = '無法讀取資料夾，請檢查 API Key 或資料夾 ID。';
          return;
        }

        const mp3Files = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
        const lrcFiles = data.files.filter(f => f.name.toLowerCase().endsWith('.lrc'));

        playlistData = mp3Files.map(mp3 => {
          const baseName = mp3.name.substring(0, mp3.name.lastIndexOf('.'));
          const matchedLrc = lrcFiles.find(lrc => lrc.name.substring(0, lrc.name.lastIndexOf('.')) === baseName);
          const sizeBytes = parseInt(mp3.size || '0', 10);
          const isLong = sizeBytes >= 14400000;

          return {
            title: baseName,
            id: mp3.id,
            lrcId: matchedLrc ? matchedLrc.id : null,
            isLong: isLong
          };
        });

        loadingMsg.style.display = 'none';
        if (playlistData.length > 0) {
          playlistContainer.style.display = 'block';
          tabsContainer.style.display = 'flex'; 
          toggleLyricsBtn.style.display = 'block';
          renderPlaylist();
          
          // 讀取「這個資料夾」專屬的記憶進度
          let savedIndex = parseInt(localStorage.getItem(getIndexKey())) || 0;
          let savedTime = parseFloat(localStorage.getItem(getTimeKey())) || 0;
          if (savedIndex >= playlistData.length) savedIndex = 0;
          
          loadTrack(savedIndex, savedTime);
        } else {
          loadingMsg.textContent = '這個資料夾內沒有 MP3 檔案。';
          loadingMsg.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        loadingMsg.textContent = '讀取失敗，請確認 API 狀態。';
      }
    }

    async function fetchLRC(lrcId) {
      if (!lrcId) return [];
      const url = `https://www.googleapis.com/drive/v3/files/${lrcId}?alt=media&key=${API_KEY}`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        return parseLRC(text);
      } catch (e) {
        return [];
      }
    }

    function parseLRC(lrcString) {
      if (!lrcString) return [];
      const lines = lrcString.split('\n');
      const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
      const lyrics = [];
      for (const line of lines) {
        const match = line.match(regex);
        if (match) {
          const min = parseInt(match[1], 10);
          const sec = parseInt(match[2], 10);
          const ms = parseInt(match[3], 10);
          const time = min * 60 + sec + ms / (match[3].length === 2 ? 100 : 1000);
          const text = match[4].trim();
          if (text) lyrics.push({ time, text });
        }
      }
      return lyrics;
    }

    async function loadTrack(index, resumeTime = 0) {
      const track = playlistData[index];
      currentIndex = index;
      titleEl.textContent = track.title;
      
      audio.src = `https://www.googleapis.com/drive/v3/files/${track.id}?alt=media&key=${API_KEY}`;
      
      audio.onloadedmetadata = () => {
        if (resumeTime > 0) {
          audio.currentTime = resumeTime;
          resumeTime = 0; 
        }
      };

      lyricsContainer.innerHTML = '<div class="lyric-line">載入歌詞中...</div>';
      parsedLyrics = await fetchLRC(track.lrcId);
      
      lyricsContainer.innerHTML = '';
      if (parsedLyrics.length > 0) {
        parsedLyrics.forEach((lyric, idx) => {
          const div = document.createElement('div');
          div.className = 'lyric-line';
          div.id = `lyric-${idx}`;
          div.textContent = lyric.text;
          lyricsContainer.appendChild(div);
        });
      } else {
        lyricsContainer.innerHTML = '<div class="lyric-line">無提供歌詞 (.lrc)</div>';
      }

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: track.title, album: 'MZG 客家精神音樂播放器' });
      }

      updatePlaylistUI();
    }

    audio.addEventListener('timeupdate', () => {
      // 隨時寫入「這個資料夾」專屬的記憶進度
      localStorage.setItem(getIndexKey(), currentIndex);
      localStorage.setItem(getTimeKey(), audio.currentTime);

      if (parsedLyrics.length === 0) return;
      const currentTime = audio.currentTime;
      let activeIndex = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) activeIndex = i;
        else break;
      }
      if (activeIndex !== -1) {
        const allLines = lyricsContainer.querySelectorAll('.lyric-line');
        allLines.forEach(line => line.classList.remove('active'));
        const activeLine = document.getElementById(`lyric-${activeIndex}`);
        if (activeLine && !activeLine.classList.contains('active')) {
          activeLine.classList.add('active');
          activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlistData.forEach((track, index) => {
        const btn = document.createElement('button');
        btn.className = 'track-btn';
        btn.dataset.isLong = track.isLong;
        
        const textSpan = document.createElement('span');
        textSpan.textContent = `${index + 1}. ${track.title}`;
        btn.appendChild(textSpan);

        if (track.isLong) {
          const badge = document.createElement('span');
          badge.className = 'badge-long';
          badge.textContent = '⏳ 10分+';
          btn.appendChild(badge);
        }

        btn.onclick = () => { 
          loadTrack(index, 0); 
          audio.play(); 
        };
        playlistContainer.appendChild(btn);
      });
      
      applyFilter();
    }

    function updatePlaylistUI() {
      const buttons = playlistContainer.querySelectorAll('.track-btn');
      buttons.forEach((btn, idx) => btn.classList.toggle('active', idx === currentIndex));
    }

    // 啟動時自動載入記憶中的資料夾
    fetchDriveFiles();
  </script>
</body>
</html>
