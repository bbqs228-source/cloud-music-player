<script>
/* =========================
   只需要修改這一區
   ========================= */
const API_KEY='AIzaSyClVDG_eXTcR5U1-4j9tN_9tJKfoegBf1c';
const FOLDERS={
  music1:'1n0n4ZJUGrtDtEcc79QakcMUYG52g60UX',
  music2:'12qXblcE82laVwc7d7VhUoEzusnWTNmZ6'
};
const COVER_URL='https://cdn-icons-png.flaticon.com/512/3269/3269985.png';
const ARTIST='MZG 馬子狗';
const ALBUM='客家精神雲端播放器';
const LONG_BYTES=14400000;
/* ========================= */

const $=id=>document.getElementById(id);
const audio=$('audio'),title=$('title'),folder=$('folder'),status=$('status'),small=$('small'),
playlist=$('playlist'),tabs=$('tabs'),lyrics=$('lyrics'),playBtn=$('playBtn'),
modeBtn=$('modeBtn'),progress=$('progress'),now=$('now'),duration=$('duration'),
volume=$('volume'),muteBtn=$('muteBtn'),syncBtn=$('syncBtn'),themeBtn=$('themeBtn'),
toggleLyrics=$('toggleLyrics'),
trackSize=$('trackSize'),bitrate=$('bitrate'),
sessionTraffic=$('sessionTraffic'),todayTraffic=$('todayTraffic'),nowFavBtn=$('nowFavBtn');

let tracks=[],currentIndex=0,parsedLyrics=[],activeLyric=-1;
let currentFilter=localStorage.getItem('mzg_saved_playlist_filter')||'all';
if(!['all','short','long','favorite'].includes(currentFilter))currentFilter='all';
let shuffleQueue=[],shuffleHistory=[],loadToken=0,isSeeking=false,isSyncing=false;
let lastSave=0,lastMediaUpdate=0;

/* ===== iPhone 播放控制狀態 ===== */
let manualPause=false;
let shouldContinuePlayback=false;
let playbackIntentVersion=0;
let backgroundSwitching=false;
let recoveryTimer=null;
let recoveryAttempts=0;
let nextPreparedIndex=-1;
let nextPreparedUrl='';
let lastPlayButtonTap=0;
let endFallbackTriggered=false;


/* ===== 流量估算 =====
   注意：這是依「檔案大小 ÷ 歌曲長度 × 實際播放秒數」估算，
   Safari 預載、HTTP Range、快取等實際網路流量可能不同。
*/
let sessionBytes=0;
let todayBytes=0;
let lastTrafficMediaTime=null;
let lastTrafficWallTime=null;
let trafficDate='';
let trafficSaveAt=0;

const K={
 folder:'mzg_saved_folder',
 loop:'mzg_saved_loop_mode',
 lyrics:'mzg_saved_lyrics_state',
 theme:'mzg_saved_theme',
 volume:'mzg_saved_volume',
 filter:'mzg_saved_playlist_filter'
};
let currentFolder=localStorage.getItem(K.folder)||'music1';
if(!FOLDERS[currentFolder])currentFolder='music1';
let loopMode=localStorage.getItem(K.loop)||'list';
let lyricsHidden=localStorage.getItem(K.lyrics)==='true';
let theme=localStorage.getItem(K.theme)||'dark';

const indexKey=()=>`mzg_saved_track_index_${currentFolder}`;
const idKey=()=>`mzg_saved_track_id_${currentFolder}`;
const timeKey=()=>`mzg_saved_track_time_${currentFolder}`;
const cacheKey=()=>`mzg_playlist_cache_v2_${currentFolder}`;
const FAVORITES_KEY='mzg_favorite_track_ids_v1';
const CAR_MODE_KEY='mzg_saved_car_mode';

function loadFavoriteIds(){
  try{
    const raw=JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]');
    return new Set(Array.isArray(raw)?raw:[]);
  }catch(e){
    return new Set();
  }
}

let favoriteIds=loadFavoriteIds();

function saveFavoriteIds(){
  try{
    localStorage.setItem(FAVORITES_KEY,JSON.stringify([...favoriteIds]));
  }catch(e){}
}

function isFavorite(track){
  return !!track&&favoriteIds.has(track.id);
}

function updateNowFavoriteUI(){
  const track=tracks[currentIndex];
  const active=isFavorite(track);
  nowFavBtn.classList.toggle('active',active);
  nowFavBtn.textContent=active?'♥':'♡';
  nowFavBtn.title=active?'取消最愛':'加入最愛';
  nowFavBtn.setAttribute('aria-label',nowFavBtn.title);
}

function toggleFavorite(index,event){
  if(event){
    event.stopPropagation();
    event.preventDefault();
  }

  const track=tracks[index];
  if(!track)return;

  if(favoriteIds.has(track.id)){
    favoriteIds.delete(track.id);
  }else{
    favoriteIds.add(track.id);
  }

  saveFavoriteIds();
  renderPlaylist();
  updatePlaylistUI();
  updateNowFavoriteUI();
}


const trafficDateKey=()=>`mzg_traffic_date`;
const trafficBytesKey=()=>`mzg_traffic_bytes`;

function localDateString(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function loadTrafficToday(){
  const today=localDateString();
  const savedDate=localStorage.getItem(trafficDateKey());
  trafficDate=today;

  if(savedDate===today){
    const v=Number(localStorage.getItem(trafficBytesKey()));
    todayBytes=Number.isFinite(v)&&v>=0?v:0;
  }else{
    todayBytes=0;
    localStorage.setItem(trafficDateKey(),today);
    localStorage.setItem(trafficBytesKey(),'0');
  }

  updateTrafficUI();
}

function formatBytes(bytes){
  if(!Number.isFinite(bytes)||bytes<=0)return '0 MB';
  const mb=bytes/1024/1024;
  if(mb<1)return `${Math.max(0.01,mb).toFixed(2)} MB`;
  if(mb<100)return `${mb.toFixed(1)} MB`;
  return `${Math.round(mb)} MB`;
}

function updateTrafficUI(){
  sessionTraffic.textContent=formatBytes(sessionBytes);
  todayTraffic.textContent=formatBytes(todayBytes);

  const t=tracks[currentIndex];

  if(t&&Number.isFinite(t.sizeBytes)&&t.sizeBytes>0){
    trackSize.textContent=formatBytes(t.sizeBytes);
  }else{
    trackSize.textContent='--';
  }

  if(
    t &&
    Number.isFinite(t.sizeBytes) &&
    t.sizeBytes>0 &&
    Number.isFinite(audio.duration) &&
    audio.duration>0
  ){
    const kbps=(t.sizeBytes*8/audio.duration)/1000;
    bitrate.textContent=`${Math.round(kbps)} kbps`;
  }else{
    bitrate.textContent='--';
  }
}

function addTrafficEstimate(deltaMediaSeconds){
  const t=tracks[currentIndex];

  if(
    !t ||
    !Number.isFinite(t.sizeBytes) ||
    t.sizeBytes<=0 ||
    !Number.isFinite(audio.duration) ||
    audio.duration<=0 ||
    !Number.isFinite(deltaMediaSeconds) ||
    deltaMediaSeconds<=0
  )return;

  /* 避免拖曳進度條／切歌造成數十秒到數分鐘被誤算成流量 */
  if(deltaMediaSeconds>4)return;

  const estimated=t.sizeBytes*(deltaMediaSeconds/audio.duration);
  if(!Number.isFinite(estimated)||estimated<=0)return;

  const today=localDateString();
  if(today!==trafficDate){
    trafficDate=today;
    todayBytes=0;
    localStorage.setItem(trafficDateKey(),today);
  }

  sessionBytes+=estimated;
  todayBytes+=estimated;
  updateTrafficUI();

  const nowMs=Date.now();
  if(nowMs-trafficSaveAt>=5000){
    localStorage.setItem(trafficBytesKey(),String(todayBytes));
    trafficSaveAt=nowMs;
  }
}

loadTrafficToday();

const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS)document.querySelector('.volume').style.display='none';

function applyTheme(){
  document.body.classList.toggle('light',theme==='light');
  themeBtn.textContent=theme==='light'?'🌙':'🌞';
  $('themeColor').content=theme==='light'?'#f0f2f5':'#121212';
}
applyTheme();
themeBtn.onclick=()=>{
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem(K.theme,theme);
  applyTheme();
};

function fmt(sec){
  if(!Number.isFinite(sec)||sec<0)return'0:00';
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}

const savedVol=Number(localStorage.getItem(K.volume));
if(Number.isFinite(savedVol)&&savedVol>=0&&savedVol<=1){audio.volume=savedVol;volume.value=savedVol*100}
function muteIcon(){muteBtn.textContent=audio.muted||audio.volume===0?'🔇':audio.volume<.5?'🔉':'🔊'}
muteIcon();
volume.oninput=e=>{
  audio.volume=+e.target.value/100;
  audio.muted=false;
  localStorage.setItem(K.volume,audio.volume);
  muteIcon();
};
muteBtn.onclick=()=>{audio.muted=!audio.muted;muteIcon()};

async function directPlay(){
  manualPause=false;
  shouldContinuePlayback=true;
  playbackIntentVersion++;
  clearRecovery();
  recoveryAttempts=0;

  if(audio.ended || (Number.isFinite(audio.duration) && audio.currentTime>=audio.duration-0.1)){
    try{audio.currentTime=0}catch(e){}
  }

  try{
    await audio.play();
    return true;
  }catch(e){
    console.log('播放失敗',e);
    return false;
  }
}

function directPause(){
  manualPause=true;
  shouldContinuePlayback=false;
  playbackIntentVersion++;
  clearRecovery();
  recoveryAttempts=0;

  try{audio.pause()}catch(e){}
  playBtn.textContent='▶';

  try{
    if('mediaSession' in navigator){
      navigator.mediaSession.playbackState='paused';
    }
  }catch(e){}
}

function userPlay(){ return directPlay(); }
function userPause(){ directPause(); }

function handlePlayButtonTap(e){
  if(e){
    e.preventDefault();
    e.stopPropagation();
  }

  const t=Date.now();
  if(t-lastPlayButtonTap<180)return;
  lastPlayButtonTap=t;

  if(audio.paused || audio.ended){
    directPlay();
  }else{
    directPause();
  }
}

playBtn.onclick=null;
playBtn.addEventListener('click',handlePlayButtonTap,{passive:false});

audio.onplay=()=>{
  manualPause=false;
  shouldContinuePlayback=true;
  recoveryAttempts=0;
  clearRecovery();
  playBtn.textContent='⏸';
  try{navigator.mediaSession.playbackState='playing'}catch(e){}
};

function finishSeek(){
  if(!Number.isFinite(audio.duration)){isSeeking=false;return}
  audio.currentTime=Math.max(0,Math.min((+progress.value/100)*audio.duration,audio.duration));
  isSeeking=false;saveState();updateMediaPosition(true);
}

function seekBy(sec){
  if(!Number.isFinite(audio.duration))return;
  audio.currentTime=Math.max(0,Math.min(audio.currentTime+sec,audio.duration));

}

function validIndices(){
  return tracks
    .map((t,i)=>({t,i}))
    .filter(({t})=>
      currentFilter==='all' ||
      (currentFilter==='short'&&!t.isLong) ||
      (currentFilter==='long'&&t.isLong) ||
      (currentFilter==='favorite'&&isFavorite(t))
    )
    .map(x=>x.i);
}
function restoreFilterTabUI(){
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.filter===currentFilter);
  });
}

function applyFilter(){
  playlist.querySelectorAll('.track').forEach((b,i)=>{
    const t=tracks[i];
    const show=
      currentFilter==='all' ||
      (currentFilter==='short'&&!t.isLong) ||
      (currentFilter==='long'&&t.isLong) ||
      (currentFilter==='favorite'&&isFavorite(t));
    b.style.display=show?'flex':'none';
  });
}

function computeNextIndex(){
  const valid=validIndices();
  if(!valid.length)return -1;

  if(loopMode==='shuffle'){
    shuffleQueue=shuffleQueue.filter(i=>valid.includes(i));
    if(!shuffleQueue.length){
      shuffleQueue=[...valid];
      for(let i=shuffleQueue.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [shuffleQueue[i],shuffleQueue[j]]=[shuffleQueue[j],shuffleQueue[i]];
      }
      if(shuffleQueue.length>1&&shuffleQueue[0]===currentIndex){
        shuffleQueue.push(shuffleQueue.shift());
      }
    }
    return shuffleQueue[0] ?? -1;
  }

  const p=valid.indexOf(currentIndex);
  return valid[p<0?0:(p+1)%valid.length];
}

function mediaUrlFor(track){
  if(!track)return'';
  const p=new URLSearchParams({alt:'media',key:API_KEY});
  return `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(track.id)}?${p}`;
}

function prepareNextTrack(){
  const idx=computeNextIndex();
  if(idx<0||!tracks[idx])return;
  nextPreparedIndex=idx;
  nextPreparedUrl=mediaUrlFor(tracks[idx]);
}

function consumeNextIndex(){
  const valid=validIndices();
  if(!valid.length)return -1;

  if(loopMode==='shuffle'){
    const idx=(nextPreparedIndex>=0&&valid.includes(nextPreparedIndex))
      ? nextPreparedIndex
      : computeNextIndex();

    shuffleHistory.push(currentIndex);
    if(shuffleHistory.length>50)shuffleHistory.shift();

    const qpos=shuffleQueue.indexOf(idx);
    if(qpos>=0)shuffleQueue.splice(qpos,1);
    nextPreparedIndex=-1;
    nextPreparedUrl='';
    return idx;
  }

  const idx=(nextPreparedIndex>=0&&valid.includes(nextPreparedIndex))
    ? nextPreparedIndex
    : computeNextIndex();
  nextPreparedIndex=-1;
  nextPreparedUrl='';
  return idx;
}

function clearRecovery(){
  if(recoveryTimer){
    clearTimeout(recoveryTimer);
    recoveryTimer=null;
  }
}

function scheduleRecovery(delay=1800){
  clearRecovery();

  if(manualPause || !shouldContinuePlayback)return;

  recoveryTimer=setTimeout(async()=>{
    if(manualPause || !shouldContinuePlayback)return;
    if(!audio.paused && audio.readyState>=2)return;
    if(recoveryAttempts>=2)return;

    recoveryAttempts++;

    try{
      await audio.play();
    }catch(e){
      if(recoveryAttempts<2 && !manualPause){
        scheduleRecovery(2200);
      }
    }
  },delay);
}


function switchTrackAndPlay(index, options={}){
  if(!tracks[index])return;

  const token=++loadToken;
  saveState();

  const track=tracks[index];
  currentIndex=index;
  endFallbackTriggered=false;
  activeLyric=-1;
  parsedLyrics=[];
  lastTrafficMediaTime=null;
  lastTrafficWallTime=null;
  manualPause=false;
  shouldContinuePlayback=true;
  recoveryAttempts=0;
  clearRecovery();

  title.textContent=track.title;
  document.title=`${track.title}｜客家精神`;
  updatePlaylistUI();
  updateTrafficUI();

  const streamUrl=mediaUrlFor(track);

  // iOS 關鍵：換 src 後立即呼叫 play()。
  audio.src=streamUrl;

  localStorage.setItem(idKey(),track.id);
  localStorage.setItem(indexKey(),index);

  audio.addEventListener('loadedmetadata',()=>{
    if(token!==loadToken)return;

    duration.textContent=fmt(audio.duration);
    updateTrafficUI();
    updateMediaPosition(true);
    prepareNextTrack();
  },{once:true});

  updateMediaMetadata(track);

  const playPromise=audio.play();
  if(playPromise&&typeof playPromise.catch==='function'){
    playPromise.catch(e=>{
      console.log('切歌後播放失敗',e);
      if(!manualPause&&shouldContinuePlayback){
        scheduleRecovery(1200);
      }
    });
  }

  // 音訊已要求播放後才處理歌詞。
  lyrics.innerHTML=document.hidden
    ? '<div class="line">背景播放中，歌詞稍後載入...</div>'
    : '<div class="line">載入歌詞中...</div>';

  setTimeout(async()=>{
    const l=await fetchLRC(track.lrcId);
    if(token!==loadToken)return;
    parsedLyrics=l;
    renderLyrics();
    updatePlaylistUI();
  },50);
}

function nextTrack(){
  const next=consumeNextIndex();
  if(next<0||!tracks[next])return;
  switchTrackAndPlay(next,{reason:'next'});
}

function prevTrack(){
  const valid=validIndices();
  if(!valid.length)return;

  let prev=-1;

  if(loopMode==='shuffle'){
    while(shuffleHistory.length){
      const i=shuffleHistory.pop();
      if(valid.includes(i)){prev=i;break}
    }
  }

  if(prev<0){
    const p=valid.indexOf(currentIndex);
    prev=valid[p<0?0:(p-1+valid.length)%valid.length];
  }

  switchTrackAndPlay(prev,{reason:'prev'});
}

$('nextBtn').onclick=()=>nextTrack();
$('prevBtn').onclick=()=>prevTrack();
audio.onended=()=>{
  if(manualPause)return;

  shouldContinuePlayback=true;

  if(loopMode==='single'){
    try{
      audio.currentTime=0;
      const p=audio.play();
      if(p&&typeof p.catch==='function'){
        p.catch(()=>scheduleRecovery(1200));
      }
    }catch(e){
      scheduleRecovery(1200);
    }
    return;
  }

  nextTrack();
};

  if(idx<0){

    if(Number.isInteger(old)&&old>=0&&old<tracks.length)idx=old;
  }
  if(idx<0)idx=0;

async function fetchDrive(force=false){
  const ck=cacheKey();

  if(!force){
    const cached=localStorage.getItem(ck);
    if(cached){
      try{
        const arr=JSON.parse(cached);
        if(Array.isArray(arr)&&arr.length&&arr.every(x=>Number.isFinite(Number(x.sizeBytes))&&Number(x.sizeBytes)>0)){
          tracks=arr.map(x=>({...x,sizeBytes:Number(x.sizeBytes)}));
          setupUI('cache');
          return;
        }
      }catch(e){localStorage.removeItem(ck)}
    }
  }

  if(!API_KEY||API_KEY.includes('請在這裡')){
    status.textContent='⚠️ 請先在程式上方填入 Google API Key。';
    return;
  }

  const root=FOLDERS[currentFolder];
  if(!root){status.textContent='找不到指定的 Google Drive 資料夾。';return}

  syncState(true);
  status.style.display='block';
  status.textContent='☁️ 正在掃描 Google Drive 音樂資料夾…';

  try{
    let mp3s=[],lrcs=[],queue=[root];

    while(queue.length){
      const batch=queue.splice(0,5);
      const result=await Promise.all(batch.map(async folderId=>{
        let token='',m=[],l=[],f=[];
        do{
          const p=new URLSearchParams({
            q:`'${folderId}' in parents and trashed = false`,
            pageSize:'1000',
            fields:'nextPageToken,files(id,name,mimeType,size,createdTime)',
            key:API_KEY
          });
          if(token)p.set('pageToken',token);

          const res=await fetch('https://www.googleapis.com/drive/v3/files?'+p,{cache:'no-store'});
          if(!res.ok){
            let msg='';
            try{msg=(await res.json())?.error?.message||''}catch(e){}
            throw new Error(`Google Drive API ${res.status}${msg?'：'+msg:''}`);
          }
          const data=await res.json();
          (data.files||[]).forEach(file=>{
            const name=(file.name||'').toLowerCase();
            if(file.mimeType==='application/vnd.google-apps.folder')f.push(file.id);
            else if(name.endsWith('.mp3'))m.push(file);
            else if(name.endsWith('.lrc'))l.push(file);
          });
          token=data.nextPageToken||'';
        }while(token);
        return{m,l,f};
      }));

      result.forEach(r=>{mp3s.push(...r.m);lrcs.push(...r.l);queue.push(...r.f)});
    }

    if(!mp3s.length){status.textContent='Google Drive 資料夾內沒有找到 MP3。';return}

    const lrcMap=new Map();
    lrcs.forEach(x=>{
      const n=x.name||'',dot=n.lastIndexOf('.');
      lrcMap.set((dot>=0?n.slice(0,dot):n).trim().toLowerCase(),x.id);
    });

    tracks=mp3s.map(x=>{
      const n=x.name||'',dot=n.lastIndexOf('.'),base=dot>=0?n.slice(0,dot):n;
      const size=Number.parseInt(x.size||'0',10);
      return{
        title:base,id:x.id,lrcId:lrcMap.get(base.trim().toLowerCase())||null,
        isLong:size>=LONG_BYTES,sizeBytes:size,
        createdTime:x.createdTime?new Date(x.createdTime).getTime():0
      };
    }).sort((a,b)=>a.createdTime-b.createdTime);

    try{localStorage.setItem(ck,JSON.stringify(tracks))}catch(e){}
    setupUI('cloud');
  }catch(e){
    console.error(e);
    const backup=localStorage.getItem(ck);
    if(backup){
      try{
        const arr=JSON.parse(backup);
        if(Array.isArray(arr)&&arr.length){
          tracks=arr;setupUI('cache');
          small.textContent='⚠️ 雲端同步失敗，目前使用舊快取';
          return;
        }
      }catch(_){}
    }
    status.style.display='block';
    status.textContent='❌ Google Drive 讀取失敗：'+e.message;
  }finally{syncState(false)}
}

async function fetchLRC(id){
  if(!id)return[];
  const p=new URLSearchParams({alt:'media',key:API_KEY});
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?${p}`);
    if(!r.ok)return[];
    return parseLRC(await r.text());
  }catch(e){return[]}
}

function parseLRC(text){
  if(!text)return[];
  const out=[],re=/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
  text.replace(/\r/g,'').split('\n').forEach(line=>{
    const lyric=line.replace(re,'').trim();if(!lyric)return;
    re.lastIndex=0;let m;
    while((m=re.exec(line))){
      const min=+m[1],sec=+m[2],frac=m[3]||'';
      let ms=0;
      if(frac.length===1)ms=+frac*100;
      else if(frac.length===2)ms=+frac*10;
      else if(frac)ms=+frac.slice(0,3);
      out.push({time:min*60+sec+ms/1000,text:lyric});
    }
  });
  return out.sort((a,b)=>a.time-b.time);
}

async function loadTrack(index,resume=0,options={}){
  if(!tracks[index])return;

  const token=++loadToken;
  saveState();

  const track=tracks[index];
  currentIndex=index;
  endFallbackTriggered=false;
  activeLyric=-1;
  parsedLyrics=[];
  lastTrafficMediaTime=null;
  lastTrafficWallTime=null;
  updateTrafficUI();

  title.textContent=track.title;
  document.title=`${track.title}｜客家精神`;
  updatePlaylistUI();

  const streamUrl=options.preparedUrl||mediaUrlFor(track);

  // 設 src 本身已會觸發媒體載入；iOS 背景時不要再額外 audio.load()
  audio.src=streamUrl;

  localStorage.setItem(idKey(),track.id);
  localStorage.setItem(indexKey(),index);

  const restore=Number(resume);

  audio.addEventListener('loadedmetadata',()=>{
    if(token!==loadToken)return;

    duration.textContent=fmt(audio.duration);
    updateTrafficUI();

    if(
      Number.isFinite(restore)&&
      restore>0&&
      Number.isFinite(audio.duration)&&
      restore<audio.duration-2
    ){
      try{audio.currentTime=Math.min(restore,audio.duration-.25)}catch(e){}
    }

    updateMediaPosition(true);
    prepareNextTrack();
  },{once:true});

  updateMediaMetadata(track);


  // 歌詞永遠不阻塞音樂
  lyrics.innerHTML=options.deferLyrics
    ? '<div class="line">背景播放中，歌詞稍後載入...</div>'
    : '<div class="line">載入歌詞中...</div>';

  const loadLyricsLater=async()=>{
    const l=await fetchLRC(track.lrcId);
    if(token!==loadToken)return;
    parsedLyrics=l;
    renderLyrics();
    updatePlaylistUI();
  };

  if(options.deferLyrics){
    setTimeout(loadLyricsLater,50);
    return;
  }

  await loadLyricsLater();
}
function renderLyrics(){
  lyrics.innerHTML='';
  if(!parsedLyrics.length){
    lyrics.innerHTML='<div class="line">無提供歌詞 (.lrc)</div>';
    return;
  }
  const frag=document.createDocumentFragment();
  parsedLyrics.forEach((x,i)=>{
    const d=document.createElement('div');
    d.className='line';d.id=`lyric-${i}`;d.textContent=x.text;
    d.onclick=()=>{
      audio.currentTime=x.time;
      updateActiveLyric(true);
      saveState();updateMediaPosition(true);
    };
    frag.appendChild(d);
  });
  lyrics.appendChild(frag);
}

function updateActiveLyric(force=false){
  if(!parsedLyrics.length)return;
  let lo=0,hi=parsedLyrics.length-1,idx=-1,t=audio.currentTime;
  while(lo<=hi){
    const m=(lo+hi)>>1;
    if(t>=parsedLyrics[m].time){idx=m;lo=m+1}else hi=m-1;
  }
  if(idx<0||(idx===activeLyric&&!force))return;

  const old=activeLyric>=0?$(`lyric-${activeLyric}`):null;
  if(old)old.classList.remove('active');
  activeLyric=idx;
  const line=$(`lyric-${idx}`);
  if(!line)return;
  line.classList.add('active');

  if(!lyricsHidden){
    const top=line.offsetTop-lyrics.clientHeight/2+line.clientHeight/2;
    lyrics.scrollTo({top:Math.max(0,top),behavior:force?'auto':'smooth'});
  }
}

audio.ontimeupdate=()=>{
  if(!isSeeking&&Number.isFinite(audio.duration)&&audio.duration>0){
    const remaining=audio.duration-audio.currentTime;

    if(remaining<=12 && remaining>0 && nextPreparedIndex<0 && loopMode!=='single'){
      prepareNextTrack();
    }

    // iOS 背景偶爾不送 ended；剩不到 0.35 秒時做一次保險切歌。
    if(
      remaining<=0.35 &&
      remaining>=0 &&
      !endFallbackTriggered &&
      !manualPause &&
      shouldContinuePlayback &&
      loopMode!=='single'
    ){
      endFallbackTriggered=true;
      setTimeout(()=>{
        if(
          !manualPause &&
          shouldContinuePlayback &&
          (audio.ended || (Number.isFinite(audio.duration) && audio.duration-audio.currentTime<=0.5))
        ){
          nextTrack();
        }
      },180);
    }
    now.textContent=fmt(audio.currentTime);
    progress.value=audio.currentTime/audio.duration*100;
  }

  if(!audio.paused&&!isSeeking&&Number.isFinite(audio.currentTime)){
    const wallNow=performance.now();
    if(lastTrafficWallTime!==null){
      const deltaWall=(wallNow-lastTrafficWallTime)/1000;
      if(deltaWall>0&&deltaWall<=4)addTrafficEstimate(deltaWall);
    }
    lastTrafficWallTime=wallNow;
    lastTrafficMediaTime=audio.currentTime;
  }else{
    lastTrafficWallTime=null;
    lastTrafficMediaTime=audio.currentTime;
  }

  updateActiveLyric();

  const n=Date.now();
  if(n-lastSave>=5000){saveState();lastSave=n}
  if(n-lastMediaUpdate>=3000){updateMediaPosition();lastMediaUpdate=n}
};


audio.addEventListener('waiting',()=>{
  if(!manualPause&&shouldContinuePlayback)scheduleRecovery(2200);
});
audio.addEventListener('stalled',()=>{
  if(!manualPause&&shouldContinuePlayback)scheduleRecovery(2200);

audio.addEventListener('error',()=>{
  if(!manualPause&&shouldContinuePlayback)scheduleRecovery(1600);
});
audio.addEventListener('canplay',()=>{
  if(!manualPause&&shouldContinuePlayback&&audio.paused&&document.hidden){
    audio.play().catch(()=>{});
  }
});

function saveState(){
  try{
    localStorage.setItem(trafficDateKey(),trafficDate||localDateString());
    localStorage.setItem(trafficBytesKey(),String(todayBytes));
  }catch(e){}
  if(!tracks[currentIndex])return;
  try{
    localStorage.setItem(idKey(),tracks[currentIndex].id);
    localStorage.setItem(indexKey(),currentIndex);
    if(Number.isFinite(audio.currentTime))localStorage.setItem(timeKey(),audio.currentTime);
  }catch(e){}
}
window.addEventListener('pagehide',saveState);
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden){
    saveState();
    return;
  }

  // 從導航 / 鎖定畫面回到播放器時，若原本應該播放卻停住，嘗試恢復
  if(!manualPause&&shouldContinuePlayback&&audio.paused&&tracks[currentIndex]){
    try{await audio.play()}catch(e){}
  }

  // 回到前景後補抓目前歌詞
  if(tracks[currentIndex]&&parsedLyrics.length===0){
    const token=loadToken;
    const l=await fetchLRC(tracks[currentIndex].lrcId);
    if(token===loadToken){
      parsedLyrics=l;
      renderLyrics();
    }
  }
});

function updateMediaMetadata(track){
  if(!('mediaSession'in navigator)||!('MediaMetadata'in window))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:track.title,artist:ARTIST,album:ALBUM,
      artwork:[{src:COVER_URL,sizes:'512x512',type:'image/png'}]
    });
  }catch(e){}
}

function updateMediaPosition(){
  if(!('mediaSession'in navigator)||typeof navigator.mediaSession.setPositionState!=='function')return;
  if(!Number.isFinite(audio.duration)||audio.duration<=0||!Number.isFinite(audio.currentTime))return;
  let pos=Math.max(0,Math.min(audio.currentTime,audio.duration));
  if(pos>=audio.duration)pos=Math.max(0,audio.duration-.01);
  try{
    navigator.mediaSession.setPositionState({
      duration:audio.duration,playbackRate:audio.playbackRate||1,position:pos
    });
  }catch(e){}
}

function mediaAction(name,fn){
  if(!('mediaSession'in navigator))return;
  try{navigator.mediaSession.setActionHandler(name,fn)}catch(e){}
}
// iPhone / iPad：不要攔截鎖定畫面的 play / pause。
// 讓 WebKit 直接控制真正的 <audio>，避免背景 JS handler 被凍結時
// 鎖定畫面只換圖示、實際音訊卻沒有停止。
if(isIOS && 'mediaSession' in navigator){
  try{navigator.mediaSession.setActionHandler('play',null)}catch(e){}
  try{navigator.mediaSession.setActionHandler('pause',null)}catch(e){}
}else{
  mediaAction('play',()=>directPlay());
  mediaAction('pause',()=>directPause());
}

mediaAction('previoustrack',prevTrack);
mediaAction('nexttrack',nextTrack);
mediaAction('seekbackward',d=>seekBy(-(d.seekOffset||15)));
mediaAction('seekforward',d=>seekBy(d.seekOffset||15));
mediaAction('seekto',d=>{
  if(!Number.isFinite(d.seekTime)||!Number.isFinite(audio.duration))return;
  const t=Math.max(0,Math.min(d.seekTime,audio.duration));
  if(d.fastSeek&&typeof audio.fastSeek==='function')audio.fastSeek(t);
  else audio.currentTime=t;
  saveState();updateMediaPosition(true);
});

function renderPlaylist(){
  playlist.innerHTML='';
  const frag=document.createDocumentFragment();
  tracks.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='track';b.dataset.long=t.isLong;
    const name=document.createElement('span');
    name.className='name';name.textContent=`${i+1}. ${t.title}`;
    b.appendChild(name);

    const fav=document.createElement('button');
    fav.className='fav-btn'+(isFavorite(t)?' active':'');
    fav.type='button';
    fav.title=isFavorite(t)?'取消最愛':'加入最愛';
    fav.setAttribute('aria-label',fav.title);
    fav.textContent=isFavorite(t)?'♥':'♡';
    fav.onclick=e=>toggleFavorite(i,e);
    b.appendChild(fav);

    if(t.isLong){
      const badge=document.createElement('span');
      badge.className='badge';badge.textContent='⏳ 長篇';
      b.appendChild(badge);
    }

    b.onclick=()=>{
      if(i===currentIndex&&audio.src){
        if(audio.paused || audio.ended){
          directPlay();
        }else{
          directPause();
        }
        return;
      }

      if(loopMode==='shuffle'){
        shuffleHistory.push(currentIndex);
        if(shuffleHistory.length>50)shuffleHistory.shift();
      }

      switchTrackAndPlay(i,{reason:'playlist'});
    };
    frag.appendChild(b);
  });
  playlist.appendChild(frag);
  applyFilter();
}

function updatePlaylistUI(){
  updateNowFavoriteUI();
  const buttons=playlist.querySelectorAll('.track');
  buttons.forEach((b,i)=>b.classList.toggle('active',i===currentIndex));
  const b=buttons[currentIndex];
  if(!b||b.style.display==='none')return;
  const pr=playlist.getBoundingClientRect(),br=b.getBoundingClientRect();
  if(br.top<pr.top||br.bottom>pr.bottom)b.scrollIntoView({behavior:'smooth',block:'nearest'});
}

audio.onerror=()=>{
  if(audio.error)console.log('Audio Error',audio.error.code);
};

window.addEventListener('offline',()=>{
  small.style.display='block';
  small.textContent='📴 網路已中斷；已載入的歌曲可能仍可繼續播放';
});
window.addEventListener('online',()=>{
  if(tracks.length){small.style.display='block';small.textContent='🌐 網路已恢復'}
});


/* ===== 車用模式 ===== */
let carMode=localStorage.getItem(CAR_MODE_KEY)==='true';
const carModeBtn=$('car-mode-btn'),carExit=$('car-exit'),carFav=$('car-fav');
const carCurrent=$('car-current'),carDuration=$('car-duration'),carProgress=$('car-progress');
const carPlay=$('car-play'),carLoop=$('car-loop'),carFilter=$('car-filter');

function carFilterText(){
  return currentFilter==='short'?'🎵 單曲':
         currentFilter==='long'?'⏳ 長篇':
         currentFilter==='favorite'?'♥ 最愛':'🎵 全部';
}
function updateCarUI(){
  document.body.classList.toggle('car-mode',carMode);
  carModeBtn.textContent=carMode?'🚗✓':'🚗';
  carPlay.textContent=audio.paused?'▶':'⏸';
  carCurrent.textContent=fmt(audio.currentTime||0);
  carDuration.textContent=fmt(audio.duration||0);
  if(Number.isFinite(audio.duration)&&audio.duration>0)carProgress.value=(audio.currentTime/audio.duration)*100;
  const tr=tracks[currentIndex];
  const fav=isFavorite(tr);
  carFav.textContent=fav?'♥ 已加入最愛':'♡ 加到最愛';
  carFav.classList.toggle('active',fav);
  carLoop.textContent=loopMode==='single'?'🔂 單曲':loopMode==='shuffle'?'🔀 隨機':'🔁 列表';
  carLoop.classList.toggle('active',loopMode==='shuffle');
  carFilter.textContent=carFilterText();
}
function setCarMode(v){
  carMode=!!v;
  localStorage.setItem(CAR_MODE_KEY,String(carMode));
  updateCarUI();
}
carModeBtn.onclick=()=>setCarMode(!carMode);
carExit.onclick=()=>setCarMode(false);
carPlay.onclick=()=>audio.paused||audio.ended?directPlay():directPause();
$('car-prev').onclick=()=>prevTrack();
$('car-next').onclick=()=>nextTrack();
$('car-back15').onclick=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.max(0,audio.currentTime-15)};
$('car-forward15').onclick=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+15)};
carProgress.oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)carCurrent.textContent=fmt((Number(carProgress.value)/100)*audio.duration)};
carProgress.onchange=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=(Number(carProgress.value)/100)*audio.duration};
carFav.onclick=()=>{
  if(!tracks[currentIndex])return;
  toggleFavorite(currentIndex);
  restoreFilterTabUI();
  applyFilter();
  updateCarUI();
};
carLoop.onclick=()=>{
  if(loopMode==='list')loopMode='single';
  else if(loopMode==='single')loopMode='shuffle';
  else loopMode='list';
  localStorage.setItem(K.loop,loopMode);
  updateLoopUI();
  shuffleQueue=[];shuffleHistory=[];
  updateCarUI();
};
carFilter.onclick=()=>{
  const modes=['all','short','long','favorite'];
  currentFilter=modes[(modes.indexOf(currentFilter)+1)%modes.length];
  localStorage.setItem(K.filter,currentFilter);
  shuffleQueue=[];shuffleHistory=[];
  restoreFilterTabUI();applyFilter();updateCarUI();
};
audio.addEventListener('play',updateCarUI);
audio.addEventListener('pause',updateCarUI);
audio.addEventListener('loadedmetadata',updateCarUI);
audio.addEventListener('timeupdate',updateCarUI);
updateCarUI();

fetchDrive(false);
</script>
</body>
