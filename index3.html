<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#1db954;--bg:#121212;--card:#1e1e1e;--item:#2a2a2a;--panel:#181818;--muted:#aaa}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;align-items:flex-start;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;overscroll-behavior-y:none;transition:.3s}
button,select,input{font:inherit}button{touch-action:manipulation}button:disabled{opacity:.55}
.card{width:100%;max-width:480px;background:var(--card);padding:18px 16px 22px;border-radius:20px;box-shadow:0 8px 24px #0009;transition:.3s}
.top{display:flex;align-items:center;gap:6px;margin-bottom:16px;padding:8px 10px;background:var(--item);border:1px solid #444;border-radius:12px}
.top select{flex:1;min-width:0;padding:7px 8px;border:1px solid #555;border-radius:8px;background:var(--card);color:var(--g);font-weight:700;outline:none}
.icon{border:0;background:transparent;color:inherit;cursor:pointer}.sync{width:36px;height:34px;border:0;border-radius:8px;background:var(--g);font-size:15px;font-weight:700}.sync.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#themeBtn{font-size:19px;width:34px;height:34px}
h3{margin:4px 0 5px;font-size:23px;line-height:1.25;text-align:left;overflow-wrap:anywhere}
.artist{display:block;text-align:left;color:var(--muted);font-size:15px;margin-bottom:10px}
.traffic{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px;padding:9px 10px;background:var(--panel);border:1px solid #333;border-radius:10px;font-size:12px;color:var(--muted);text-align:left}
.traffic b{color:#fff;font-weight:700}
body.light .traffic{border-color:#ddd}
body.light .traffic b{color:#222}
audio{display:none}.controls{margin:17px 0 15px;display:flex;flex-direction:column;gap:13px}
.progress,.volume{display:flex;align-items:center;gap:9px}.progress{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.progress span{min-width:36px}.progress span:first-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:999px;background:#444;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--g)}
.mainbar{display:grid;grid-template-columns:44px 44px 54px 44px 44px;justify-content:space-between;align-items:center;gap:5px;margin-bottom:10px}
.nav{width:44px;height:44px;border:1px solid #555;border-radius:10px;background:var(--item);color:#fff;font-size:17px}.seek{font-size:13px;font-weight:700}
#playBtn{width:54px;height:54px;border:0;border-radius:50%;background:var(--g);font-size:21px;font-weight:700}
.mode{width:100%;min-height:42px;margin-bottom:14px;border:1px solid #555;border-radius:10px;background:var(--item);color:#fff;font-weight:700}
.tabs{display:flex;gap:7px;margin-bottom:8px}.tab{flex:1;min-height:40px;border:1px solid #444;border-radius:9px;background:var(--item);color:#aaa;font-size:13px}.tab.active{background:var(--g);color:#000;border-color:var(--g);font-weight:700}
.status{color:var(--muted);font-size:15px;line-height:1.5;margin:20px 0}.small{color:#888;font-size:11px;text-align:left;margin:-5px 0 12px}
.playlist{height:250px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--panel);border-radius:12px;padding:8px;margin-bottom:14px}
.track{width:100%;min-height:48px;margin:4px 0;padding:13px;border:1px solid transparent;border-radius:10px;background:var(--item);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.track.active{background:var(--g);color:#000;font-weight:700}.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{flex:none;padding:3px 7px;border-radius:999px;background:#ff9800;color:#000;font-size:11px;font-weight:700}
.toggle{width:100%;min-height:42px;margin-bottom:8px;border:1px solid #555;border-radius:10px;background:var(--item);color:#fff}
.lyrics{height:210px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;background:var(--panel);border-radius:12px;padding:12px 0;transition:.3s}.lyrics::-webkit-scrollbar{display:none}.lyrics.hide{height:0;opacity:0;padding:0;pointer-events:none}
.line{min-height:46px;padding:10px 14px;color:#ccc;font-size:19px;line-height:1.45;user-select:none;-webkit-user-select:none}.line.active{color:#1ed760;font-size:26px;font-weight:700}
body.light{--bg:#f0f2f5;--card:#fff;--item:#e4e6eb;--panel:#f8f9fa;--muted:#666;color:#1a1a1a}body.light .top,body.light .nav,body.light .mode,body.light .toggle,body.light .tab{border-color:#ccc}body.light .track{color:#333;border-color:#eee}body.light .track.active,body.light .tab.active{color:#000}body.light .line{color:#888}body.light .line.active{color:#159b3c}body.light input[type=range]{background:#ddd}
@media(max-width:370px){body{padding-left:8px;padding-right:8px}.card{padding-left:11px;padding-right:11px}.mainbar{grid-template-columns:41px 41px 52px 41px 41px}.nav{width:41px;height:41px}#playBtn{width:52px;height:52px}.top select{font-size:12px}}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span>📁</span>
    <select id="folder">
      <option value="music1">[MUSIC] 預設主資料夾</option>
      <option value="music2">[MUSIC2] 專輯與其他音樂</option>
    </select>
    <button id="syncBtn" class="sync" title="重新同步">🔄</button>
    <button id="themeBtn" class="icon" title="切換深淺色">🌞</button>
  </div>

  <h3 id="title">載入中...</h3>
  <span class="artist">MZG 馬子狗</span>

  <div class="traffic" id="trafficPanel">
    <div>📦 本首：<b id="trackSize">--</b></div>
    <div>🎧 品質：約 <b id="bitrate">--</b></div>

  <audio id="audio" preload="metadata" playsinline></audio>

  <div class="mainbar">
    <button id="prevBtn" class="nav">⏮</button>
    <button id="backBtn" class="nav seek">↶15</button>

  <button id="modeBtn" class="mode">🔁 列表循環</button>

  <div id="tabs" class="tabs" style="display:none">
    <button class="tab active" data-filter="all">全部</button>
    <button class="tab" data-filter="short">單曲</button>
    <button class="tab" data-filter="long">長篇</button>

  <div id="status" class="status">正在載入歌單，請稍候...</div>
  <div id="small" class="small" style="display:none"></div>
  <div id="playlist" class="playlist" style="display:none"></div>
  <button id="toggleLyrics" class="toggle" style="display:none">🔽 隱藏歌詞</button>
  <div id="lyrics" class="lyrics"><div class="line">自動搜尋同名 .lrc 歌詞中...</div></div>
</div>

<script>
/* =========================
   只需要修改這一區
   ========================= */
const API_KEY='AIzaSyClVDG_eXTcR5U1-4j9tN_9tJKfoegBf1c';
const FOLDERS={
  music1:'1n0n4ZJUGrtDtEcc79QakcMUYG52g60UX',
  music2:'12qXblcE82laVwc7d7VhUoEzusnWTNmZ6'
};
const COVER_URL='https://cdn-icons-png.flaticon.com/512/3269/3269985.png';
const ARTIST='MZG 馬子狗';
const ALBUM='客家精神雲端播放器';
const LONG_BYTES=14400000;
/* ========================= */

const $=id=>document.getElementById(id);
const audio=$('audio'),title=$('title'),folder=$('folder'),status=$('status'),small=$('small'),
playlist=$('playlist'),tabs=$('tabs'),lyrics=$('lyrics'),playBtn=$('playBtn'),
modeBtn=$('modeBtn'),progress=$('progress'),now=$('now'),duration=$('duration'),
volume=$('volume'),muteBtn=$('muteBtn'),syncBtn=$('syncBtn'),themeBtn=$('themeBtn'),
toggleLyrics=$('toggleLyrics'),
trackSize=$('trackSize'),bitrate=$('bitrate'),
sessionTraffic=$('sessionTraffic'),todayTraffic=$('todayTraffic');

let tracks=[],currentIndex=0,currentFilter='all',parsedLyrics=[],activeLyric=-1;
let shuffleQueue=[],shuffleHistory=[],loadToken=0,isSeeking=false,isSyncing=false;
let lastSave=0,lastMediaUpdate=0;

/* ===== 流量估算 =====
   注意：這是依「檔案大小 ÷ 歌曲長度 × 實際播放秒數」估算，
   Safari 預載、HTTP Range、快取等實際網路流量可能不同。
*/
let sessionBytes=0;
let todayBytes=0;
let lastTrafficMediaTime=null;
let trafficDate='';
let trafficSaveAt=0;

const K={
 folder:'mzg_saved_folder',loop:'mzg_saved_loop_mode',lyrics:'mzg_saved_lyrics_state',
 theme:'mzg_saved_theme',volume:'mzg_saved_volume'
};
let currentFolder=localStorage.getItem(K.folder)||'music1';
if(!FOLDERS[currentFolder])currentFolder='music1';
let loopMode=localStorage.getItem(K.loop)||'list';
let lyricsHidden=localStorage.getItem(K.lyrics)==='true';
let theme=localStorage.getItem(K.theme)||'dark';

const indexKey=()=>`mzg_saved_track_index_${currentFolder}`;
const idKey=()=>`mzg_saved_track_id_${currentFolder}`;
const timeKey=()=>`mzg_saved_track_time_${currentFolder}`;
const cacheKey=()=>`mzg_playlist_cache_${currentFolder}`;

const trafficDateKey=()=>`mzg_traffic_date`;
const trafficBytesKey=()=>`mzg_traffic_bytes`;

function localDateString(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function loadTrafficToday(){
  const today=localDateString();
  const savedDate=localStorage.getItem(trafficDateKey());
  trafficDate=today;

  if(savedDate===today){
    const v=Number(localStorage.getItem(trafficBytesKey()));
    todayBytes=Number.isFinite(v)&&v>=0?v:0;
  }else{
    todayBytes=0;
    localStorage.setItem(trafficDateKey(),today);
    localStorage.setItem(trafficBytesKey(),'0');
  }

  updateTrafficUI();
}

function formatBytes(bytes){
  if(!Number.isFinite(bytes)||bytes<=0)return '0 MB';
  const mb=bytes/1024/1024;
  if(mb<1)return `${Math.max(0.01,mb).toFixed(2)} MB`;
  if(mb<100)return `${mb.toFixed(1)} MB`;
  return `${Math.round(mb)} MB`;
}

function updateTrafficUI(){
  sessionTraffic.textContent=formatBytes(sessionBytes);
  todayTraffic.textContent=formatBytes(todayBytes);

  const t=tracks[currentIndex];

  if(t&&Number.isFinite(t.sizeBytes)&&t.sizeBytes>0){
    trackSize.textContent=formatBytes(t.sizeBytes);
  }else{
    trackSize.textContent='--';
  }

  if(
    t &&
    Number.isFinite(t.sizeBytes) &&
    t.sizeBytes>0 &&
    Number.isFinite(audio.duration) &&
    audio.duration>0
  ){
    const kbps=(t.sizeBytes*8/audio.duration)/1000;
    bitrate.textContent=`${Math.round(kbps)} kbps`;
  }else{
    bitrate.textContent='--';
  }
}

function addTrafficEstimate(deltaMediaSeconds){
  const t=tracks[currentIndex];

  if(
    !t ||
    !Number.isFinite(t.sizeBytes) ||
    t.sizeBytes<=0 ||
    !Number.isFinite(audio.duration) ||
    audio.duration<=0 ||
    !Number.isFinite(deltaMediaSeconds) ||
    deltaMediaSeconds<=0
  )return;

  /* 避免拖曳進度條／切歌造成數十秒到數分鐘被誤算成流量 */
  if(deltaMediaSeconds>4)return;

  const estimated=t.sizeBytes*(deltaMediaSeconds/audio.duration);
  if(!Number.isFinite(estimated)||estimated<=0)return;

  const today=localDateString();
  if(today!==trafficDate){
    trafficDate=today;
    todayBytes=0;
    localStorage.setItem(trafficDateKey(),today);
  }

  sessionBytes+=estimated;
  todayBytes+=estimated;
  updateTrafficUI();

  const nowMs=Date.now();
  if(nowMs-trafficSaveAt>=5000){
    localStorage.setItem(trafficBytesKey(),String(todayBytes));
    trafficSaveAt=nowMs;
  }
}

loadTrafficToday();

const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS)document.querySelector('.volume').style.display='none';

function applyTheme(){
  document.body.classList.toggle('light',theme==='light');
  themeBtn.textContent=theme==='light'?'🌙':'🌞';
  $('themeColor').content=theme==='light'?'#f0f2f5':'#121212';
}
applyTheme();
themeBtn.onclick=()=>{
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem(K.theme,theme);
  applyTheme();
};

function fmt(sec){
  if(!Number.isFinite(sec)||sec<0)return'0:00';
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}

const savedVol=Number(localStorage.getItem(K.volume));
if(Number.isFinite(savedVol)&&savedVol>=0&&savedVol<=1){audio.volume=savedVol;volume.value=savedVol*100}
function muteIcon(){muteBtn.textContent=audio.muted||audio.volume===0?'🔇':audio.volume<.5?'🔉':'🔊'}
muteIcon();
volume.oninput=e=>{
  audio.volume=+e.target.value/100;
  audio.muted=false;
  localStorage.setItem(K.volume,audio.volume);
  muteIcon();
};
muteBtn.onclick=()=>{audio.muted=!audio.muted;muteIcon()};

async function safePlay(){
  try{await audio.play()}catch(e){console.log('Safari 尚未允許播放',e)}
}
playBtn.onclick=()=>audio.paused?safePlay():audio.pause();
audio.onplay=()=>{
  playBtn.textContent='⏸';
  try{navigator.mediaSession.playbackState='playing'}catch(e){}
};
audio.onpause=()=>{
  playBtn.textContent='▶';
  try{navigator.mediaSession.playbackState='paused'}catch(e){}
};
audio.onloadedmetadata=()=>{
  duration.textContent=fmt(audio.duration);
  lastTrafficMediaTime=audio.currentTime;
  updateTrafficUI();
  updateMediaPosition(true);
};

progress.oninput=e=>{
  if(!Number.isFinite(audio.duration))return;
  isSeeking=true;
  now.textContent=fmt((+e.target.value/100)*audio.duration);
};
function finishSeek(){
  if(!Number.isFinite(audio.duration)){isSeeking=false;return}
  audio.currentTime=Math.max(0,Math.min((+progress.value/100)*audio.duration,audio.duration));
  isSeeking=false;saveState();updateMediaPosition(true);
}
progress.onchange=finishSeek;
progress.onpointerup=()=>{if(isSeeking)finishSeek()};

function seekBy(sec){
  if(!Number.isFinite(audio.duration))return;
  audio.currentTime=Math.max(0,Math.min(audio.currentTime+sec,audio.duration));
  saveState();updateMediaPosition(true);
}
$('backBtn').onclick=()=>seekBy(-15);
$('forwardBtn').onclick=()=>seekBy(15);

folder.value=currentFolder;
folder.onchange=async e=>{
  saveState();
  currentFolder=e.target.value;
  localStorage.setItem(K.folder,currentFolder);
  shuffleQueue=[];shuffleHistory=[];
  resetUI();
  await fetchDrive(false);
};

syncBtn.onclick=async()=>{
  if(isSyncing)return;
  saveState();shuffleQueue=[];shuffleHistory=[];resetUI();
  await fetchDrive(true);
};
function syncState(v){isSyncing=v;syncBtn.disabled=v;syncBtn.classList.toggle('spin',v)}

function resetUI(){
  loadToken++;
  audio.pause();audio.removeAttribute('src');audio.load();
  title.textContent='載入中...';
  lyrics.innerHTML='<div class="line">載入中...</div>';
  playlist.style.display=tabs.style.display=toggleLyrics.style.display='none';
  status.style.display='block';status.textContent='正在載入歌單，請稍候...';
  small.style.display='none';
  progress.value=0;now.textContent=duration.textContent='0:00';
  parsedLyrics=[];activeLyric=-1;lastTrafficMediaTime=null;updateTrafficUI();
}

function updateLyricsVisibility(){
  lyrics.classList.toggle('hide',lyricsHidden);
  toggleLyrics.textContent=lyricsHidden?'🖼️ 展開歌詞':'🔽 隱藏歌詞';
}
updateLyricsVisibility();
toggleLyrics.onclick=()=>{
  lyricsHidden=!lyricsHidden;
  localStorage.setItem(K.lyrics,lyricsHidden);
  updateLyricsVisibility();
};

function updateMode(){
  modeBtn.textContent=loopMode==='single'?'🔂 單曲循環':loopMode==='shuffle'?'🔀 隨機播放':'🔁 列表循環';
}
updateMode();
modeBtn.onclick=()=>{
  loopMode=loopMode==='list'?'single':loopMode==='single'?'shuffle':'list';
  shuffleQueue=[];shuffleHistory=[];
  localStorage.setItem(K.loop,loopMode);
  updateMode();
};

document.querySelectorAll('.tab').forEach(btn=>btn.onclick=e=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  e.currentTarget.classList.add('active');
  currentFilter=e.currentTarget.dataset.filter;
  shuffleQueue=[];shuffleHistory=[];
  applyFilter();
});

function validIndices(){
  return tracks.map((t,i)=>({t,i})).filter(({t})=>
    currentFilter==='all'||(currentFilter==='short'&&!t.isLong)||(currentFilter==='long'&&t.isLong)
  ).map(x=>x.i);
}
function applyFilter(){
  playlist.querySelectorAll('.track').forEach((b,i)=>{
    const t=tracks[i];
    b.style.display=currentFilter==='all'||(currentFilter==='short'&&!t.isLong)||(currentFilter==='long'&&t.isLong)?'flex':'none';
  });
}

async function nextTrack(){
  const valid=validIndices();if(!valid.length)return;
  let next;
  if(loopMode==='shuffle'){
    shuffleQueue=shuffleQueue.filter(i=>valid.includes(i));
    if(!shuffleQueue.length){
      shuffleQueue=[...valid];
      for(let i=shuffleQueue.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [shuffleQueue[i],shuffleQueue[j]]=[shuffleQueue[j],shuffleQueue[i]];
      }
      if(shuffleQueue.length>1&&shuffleQueue[0]===currentIndex)shuffleQueue.push(shuffleQueue.shift());
    }
    shuffleHistory.push(currentIndex);
    if(shuffleHistory.length>50)shuffleHistory.shift();
    next=shuffleQueue.shift();
  }else{
    const p=valid.indexOf(currentIndex);
    next=valid[p<0?0:(p+1)%valid.length];
  }
  await loadTrack(next,0);await safePlay();
}

async function prevTrack(){
  const valid=validIndices();if(!valid.length)return;
  let prev=-1;
  if(loopMode==='shuffle'){
    while(shuffleHistory.length){
      const i=shuffleHistory.pop();
      if(valid.includes(i)){prev=i;break}
    }
    if(prev>=0&&valid.includes(currentIndex))shuffleQueue.unshift(currentIndex);
  }
  if(prev<0){
    const p=valid.indexOf(currentIndex);
    prev=valid[p<0?0:(p-1+valid.length)%valid.length];
  }
  await loadTrack(prev,0);await safePlay();
}
$('nextBtn').onclick=nextTrack;
$('prevBtn').onclick=prevTrack;
audio.onended=async()=>{
  if(loopMode==='single'){audio.currentTime=0;await safePlay()}
  else await nextTrack();
};

/* ===== 第 2 段請直接接在這一行下面 ===== */

function setupUI(source='cloud'){
  status.style.display='none';
  playlist.style.display='block';
  tabs.style.display='flex';
  toggleLyrics.style.display='block';
  renderPlaylist();
  small.style.display='block';
  small.textContent=source==='cache'?'⚡ 已使用手機快取歌單':'☁️ 已完成 Google Drive 同步';

  const savedId=localStorage.getItem(idKey());
  let idx=savedId?tracks.findIndex(t=>t.id===savedId):-1;
  if(idx<0){
    const old=Number.parseInt(localStorage.getItem(indexKey()),10);
    if(Number.isInteger(old)&&old>=0&&old<tracks.length)idx=old;
  }
  if(idx<0)idx=0;

  let tm=Number.parseFloat(localStorage.getItem(timeKey()));
  if(!Number.isFinite(tm)||tm<0)tm=0;
  loadTrack(idx,tm);
}

async function fetchDrive(force=false){
  const ck=cacheKey();

  if(!force){
    const cached=localStorage.getItem(ck);
    if(cached){
      try{
        const arr=JSON.parse(cached);
        if(Array.isArray(arr)&&arr.length){tracks=arr;setupUI('cache');return}
      }catch(e){localStorage.removeItem(ck)}
    }
  }

  if(!API_KEY||API_KEY.includes('請在這裡')){
    status.textContent='⚠️ 請先在程式上方填入 Google API Key。';
    return;
  }

  const root=FOLDERS[currentFolder];
  if(!root){status.textContent='找不到指定的 Google Drive 資料夾。';return}

  syncState(true);
  status.style.display='block';
  status.textContent='☁️ 正在掃描 Google Drive 音樂資料夾…';

  try{
    let mp3s=[],lrcs=[],queue=[root];

    while(queue.length){
      const batch=queue.splice(0,5);
      const result=await Promise.all(batch.map(async folderId=>{
        let token='',m=[],l=[],f=[];
        do{
          const p=new URLSearchParams({
            q:`'${folderId}' in parents and trashed = false`,
            pageSize:'1000',
            fields:'nextPageToken,files(id,name,mimeType,size,createdTime)',
            key:API_KEY
          });
          if(token)p.set('pageToken',token);

          const res=await fetch('https://www.googleapis.com/drive/v3/files?'+p,{cache:'no-store'});
          if(!res.ok){
            let msg='';
            try{msg=(await res.json())?.error?.message||''}catch(e){}
            throw new Error(`Google Drive API ${res.status}${msg?'：'+msg:''}`);
          }
          const data=await res.json();
          (data.files||[]).forEach(file=>{
            const name=(file.name||'').toLowerCase();
            if(file.mimeType==='application/vnd.google-apps.folder')f.push(file.id);
            else if(name.endsWith('.mp3'))m.push(file);
            else if(name.endsWith('.lrc'))l.push(file);
          });
          token=data.nextPageToken||'';
        }while(token);
        return{m,l,f};
      }));

      result.forEach(r=>{mp3s.push(...r.m);lrcs.push(...r.l);queue.push(...r.f)});
    }

    if(!mp3s.length){status.textContent='Google Drive 資料夾內沒有找到 MP3。';return}

    const lrcMap=new Map();
    lrcs.forEach(x=>{
      const n=x.name||'',dot=n.lastIndexOf('.');
      lrcMap.set((dot>=0?n.slice(0,dot):n).trim().toLowerCase(),x.id);
    });

    tracks=mp3s.map(x=>{
      const n=x.name||'',dot=n.lastIndexOf('.'),base=dot>=0?n.slice(0,dot):n;
      const size=Number.parseInt(x.size||'0',10);
      return{
        title:base,id:x.id,lrcId:lrcMap.get(base.trim().toLowerCase())||null,
        isLong:size>=LONG_BYTES,sizeBytes:size,
        createdTime:x.createdTime?new Date(x.createdTime).getTime():0
      };
    }).sort((a,b)=>a.createdTime-b.createdTime);

    try{localStorage.setItem(ck,JSON.stringify(tracks))}catch(e){}
    setupUI('cloud');
  }catch(e){
    console.error(e);
    const backup=localStorage.getItem(ck);
    if(backup){
      try{
        const arr=JSON.parse(backup);
        if(Array.isArray(arr)&&arr.length){
          tracks=arr;setupUI('cache');
          small.textContent='⚠️ 雲端同步失敗，目前使用舊快取';
          return;
        }
      }catch(_){}
    }
    status.style.display='block';
    status.textContent='❌ Google Drive 讀取失敗：'+e.message;
  }finally{syncState(false)}
}

async function fetchLRC(id){
  if(!id)return[];
  const p=new URLSearchParams({alt:'media',key:API_KEY});
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?${p}`);
    if(!r.ok)return[];
    return parseLRC(await r.text());
  }catch(e){return[]}
}

function parseLRC(text){
  if(!text)return[];
  const out=[],re=/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
  text.replace(/\r/g,'').split('\n').forEach(line=>{
    const lyric=line.replace(re,'').trim();if(!lyric)return;
    re.lastIndex=0;let m;
    while((m=re.exec(line))){
      const min=+m[1],sec=+m[2],frac=m[3]||'';
      let ms=0;
      if(frac.length===1)ms=+frac*100;
      else if(frac.length===2)ms=+frac*10;
      else if(frac)ms=+frac.slice(0,3);
      out.push({time:min*60+sec+ms/1000,text:lyric});
    }
  });
  return out.sort((a,b)=>a.time-b.time);
}

async function loadTrack(index,resume=0){
  if(!tracks[index])return;
  const token=++loadToken;
  saveState();

  const track=tracks[index];
  currentIndex=index;activeLyric=-1;parsedLyrics=[];lastTrafficMediaTime=null;updateTrafficUI();
  title.textContent=track.title;
  document.title=`${track.title}｜客家精神`;
  updatePlaylistUI();

  const p=new URLSearchParams({alt:'media',key:API_KEY});
  audio.src=`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(track.id)}?${p}`;
  localStorage.setItem(idKey(),track.id);
  localStorage.setItem(indexKey(),index);

  const restore=Number(resume);
  audio.addEventListener('loadedmetadata',()=>{
    if(token!==loadToken)return;
    duration.textContent=fmt(audio.duration);
    if(Number.isFinite(restore)&&restore>0&&Number.isFinite(audio.duration)&&restore<audio.duration-2){
      try{audio.currentTime=Math.min(restore,audio.duration-.25)}catch(e){}
    }
    updateMediaPosition(true);
  },{once:true});

  updateMediaMetadata(track);
  lyrics.innerHTML='<div class="line">載入歌詞中...</div>';
  const l=await fetchLRC(track.lrcId);
  if(token!==loadToken)return;
  parsedLyrics=l;
  renderLyrics();
  updatePlaylistUI();
}

function renderLyrics(){
  lyrics.innerHTML='';
  if(!parsedLyrics.length){
    lyrics.innerHTML='<div class="line">無提供歌詞 (.lrc)</div>';
    return;
  }
  const frag=document.createDocumentFragment();
  parsedLyrics.forEach((x,i)=>{
    const d=document.createElement('div');
    d.className='line';d.id=`lyric-${i}`;d.textContent=x.text;
    d.onclick=()=>{
      audio.currentTime=x.time;
      updateActiveLyric(true);
      saveState();updateMediaPosition(true);
    };
    frag.appendChild(d);
  });
  lyrics.appendChild(frag);
}

function updateActiveLyric(force=false){
  if(!parsedLyrics.length)return;
  let lo=0,hi=parsedLyrics.length-1,idx=-1,t=audio.currentTime;
  while(lo<=hi){
    const m=(lo+hi)>>1;
    if(t>=parsedLyrics[m].time){idx=m;lo=m+1}else hi=m-1;
  }
  if(idx<0||(idx===activeLyric&&!force))return;

  const old=activeLyric>=0?$(`lyric-${activeLyric}`):null;
  if(old)old.classList.remove('active');
  activeLyric=idx;
  const line=$(`lyric-${idx}`);
  if(!line)return;
  line.classList.add('active');

  if(!lyricsHidden){
    const top=line.offsetTop-lyrics.clientHeight/2+line.clientHeight/2;
    lyrics.scrollTo({top:Math.max(0,top),behavior:force?'auto':'smooth'});
  }
}

audio.ontimeupdate=()=>{
  if(!isSeeking&&Number.isFinite(audio.duration)&&audio.duration>0){
    now.textContent=fmt(audio.currentTime);
    progress.value=audio.currentTime/audio.duration*100;
  }

  if(!audio.paused&&!isSeeking&&Number.isFinite(audio.currentTime)){
    if(lastTrafficMediaTime!==null){
      const delta=audio.currentTime-lastTrafficMediaTime;
      if(delta>0)addTrafficEstimate(delta);
    }
    lastTrafficMediaTime=audio.currentTime;
  }else{
    lastTrafficMediaTime=audio.currentTime;
  }

  updateActiveLyric();

  const n=Date.now();
  if(n-lastSave>=5000){saveState();lastSave=n}
  if(n-lastMediaUpdate>=3000){updateMediaPosition();lastMediaUpdate=n}
};

function saveState(){
  try{
    localStorage.setItem(trafficDateKey(),trafficDate||localDateString());
    localStorage.setItem(trafficBytesKey(),String(todayBytes));
  }catch(e){}
  if(!tracks[currentIndex])return;
  try{
    localStorage.setItem(idKey(),tracks[currentIndex].id);
    localStorage.setItem(indexKey(),currentIndex);
    if(Number.isFinite(audio.currentTime))localStorage.setItem(timeKey(),audio.currentTime);
  }catch(e){}
}
window.addEventListener('pagehide',saveState);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState()});

function updateMediaMetadata(track){
  if(!('mediaSession'in navigator)||!('MediaMetadata'in window))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:track.title,artist:ARTIST,album:ALBUM,
      artwork:[{src:COVER_URL,sizes:'512x512',type:'image/png'}]
    });
  }catch(e){}
}

function updateMediaPosition(){
  if(!('mediaSession'in navigator)||typeof navigator.mediaSession.setPositionState!=='function')return;
  if(!Number.isFinite(audio.duration)||audio.duration<=0||!Number.isFinite(audio.currentTime))return;
  let pos=Math.max(0,Math.min(audio.currentTime,audio.duration));
  if(pos>=audio.duration)pos=Math.max(0,audio.duration-.01);
  try{
    navigator.mediaSession.setPositionState({
      duration:audio.duration,playbackRate:audio.playbackRate||1,position:pos
    });
  }catch(e){}
}

function mediaAction(name,fn){
  if(!('mediaSession'in navigator))return;
  try{navigator.mediaSession.setActionHandler(name,fn)}catch(e){}
}
mediaAction('play',safePlay);
mediaAction('pause',()=>audio.pause());
mediaAction('previoustrack',prevTrack);
mediaAction('nexttrack',nextTrack);
mediaAction('seekbackward',d=>seekBy(-(d.seekOffset||15)));
mediaAction('seekforward',d=>seekBy(d.seekOffset||15));
mediaAction('seekto',d=>{
  if(!Number.isFinite(d.seekTime)||!Number.isFinite(audio.duration))return;
  const t=Math.max(0,Math.min(d.seekTime,audio.duration));
  if(d.fastSeek&&typeof audio.fastSeek==='function')audio.fastSeek(t);
  else audio.currentTime=t;
  saveState();updateMediaPosition(true);
});

function renderPlaylist(){
  playlist.innerHTML='';
  const frag=document.createDocumentFragment();
  tracks.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='track';b.dataset.long=t.isLong;
    const name=document.createElement('span');
    name.className='name';name.textContent=`${i+1}. ${t.title}`;
    b.appendChild(name);

    if(t.isLong){
      const badge=document.createElement('span');
      badge.className='badge';badge.textContent='⏳ 長篇';
      b.appendChild(badge);
    }

    b.onclick=async()=>{
      if(i===currentIndex&&audio.src){
        audio.paused?await safePlay():audio.pause();
        return;
      }
      if(loopMode==='shuffle'){
        shuffleHistory.push(currentIndex);
        if(shuffleHistory.length>50)shuffleHistory.shift();
      }
      await loadTrack(i,0);await safePlay();
    };
    frag.appendChild(b);
  });
  playlist.appendChild(frag);
  applyFilter();
}

function updatePlaylistUI(){
  const buttons=playlist.querySelectorAll('.track');
  buttons.forEach((b,i)=>b.classList.toggle('active',i===currentIndex));
  const b=buttons[currentIndex];
  if(!b||b.style.display==='none')return;
  const pr=playlist.getBoundingClientRect(),br=b.getBoundingClientRect();
  if(br.top<pr.top||br.bottom>pr.bottom)b.scrollIntoView({behavior:'smooth',block:'nearest'});
}

audio.onerror=()=>{
  if(audio.error)console.log('Audio Error',audio.error.code);
};

window.addEventListener('offline',()=>{
  small.style.display='block';
  small.textContent='📴 網路已中斷；已載入的歌曲可能仍可繼續播放';
});
window.addEventListener('online',()=>{
  if(tracks.length){small.style.display='block';small.textContent='🌐 網路已恢復'}
});

fetchDrive(false);
</script>
